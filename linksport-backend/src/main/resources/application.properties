# ==========================================================================
# 1. CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL (NATIVO DE LA UTP)
# ==========================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/linksport_db
spring.datasource.username=postgres
# NOTA: Cambia '123456' por la contraseña que pusiste en tu pgAdmin con el ALTER ROLE
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================================
# 2. PROPIEDADES DE HIBERNATE Y PERSISTENCIA RELACIONAL JPARepository
# ==========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SOLUCCIÓN: 'create-drop' recrea las tablas limpias desde cero en cada arranque
spring.jpa.hibernate.ddl-auto=update
# ==========================================================================
# 3. CONTROL DE INICIALIZACIÓN AUTOMÁTICA DE DATOS (import.sql)
# ==========================================================================
# Aplica los ajustes de esquema después de la actualización de Hibernate.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================================================
# 4. AJUSTES DEL SERVIDOR WEB TOMCAT EMBEBIDO
# ==========================================================================
server.port=8080
server.servlet.context-path=/

# Desactiva las alertas molestas en consola sobre vistas de base de datos abiertas
spring.jpa.open-in-view=false


# JWT: secreto Base64 de al menos 32 bytes; vacío genera una clave temporal por arranque.
linksport.auth.secreto=${LINKSPORT_JWT_SECRET:}
linksport.auth.cookie-secure=${LINKSPORT_COOKIE_SECURE:false}
linksport.auth.duracion-segundos=3600
# Solo crea el administrador si ese correo todavía no existe. Sin contraseña fija.
linksport.admin.correo=${LINKSPORT_ADMIN_EMAIL:}
linksport.admin.password=${LINKSPORT_ADMIN_PASSWORD:}