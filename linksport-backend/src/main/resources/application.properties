# ==========================================================================
# 1. CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL (NATIVO DE LA UTP)
# ==========================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/linksport_db
spring.datasource.username=postgres
# NOTA: Cambia '123456' por la contraseña que pusiste en tu pgAdmin con el ALTER ROLE
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================================
# 2. PROPIEDADES DE HIBERNATE Y PERSISTENCIA RELACIONAL JPARepository
# ==========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SOLUCCIÓN: 'create-drop' recrea las tablas limpias desde cero en cada arranque
spring.jpa.hibernate.ddl-auto=create-drop
# ==========================================================================
# 3. CONTROL DE INICIALIZACIÓN AUTOMÁTICA DE DATOS (import.sql)
# ==========================================================================
# Obliga a Spring a leer y ejecutar las inserciones de las prendas y categorías base
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================================================
# 4. AJUSTES DEL SERVIDOR WEB TOMCAT EMBEBIDO
# ==========================================================================
server.port=8080
server.servlet.context-path=/

# Desactiva las alertas molestas en consola sobre vistas de base de datos abiertas
spring.jpa.open-in-view=false

