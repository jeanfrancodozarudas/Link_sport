<!DOCTYPE html><html lang="es" data-theme="light" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión | Link Sport</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"><style>[hidden] { display: none !important; }</style></head>
<body data-pagina="login" class="has-background-light">
<div class="container px-4 py-3"><div class="is-flex is-flex-wrap-wrap is-align-items-center" style="gap: .75rem"><span data-cuenta></span><a data-login href="/login">Iniciar sesión / registrarse</a><a data-admin href="/ver-productos" hidden>Administración</a><a data-admin href="/ver-usuarios" hidden>Usuarios</a><a href="/mis-pedidos">Mis pedidos</a><button data-logout class="button is-small" type="button" hidden>Cerrar sesión</button></div><p id="sesion-status" class="help" role="status"></p></div><main class="section"><div class="container" style="max-width:700px"><a class="button mb-4" href="/">Volver a la tienda</a><h1 class="title">Tu cuenta Link Sport</h1>
<div class="box"><h2 class="title is-4">Iniciar sesión</h2><p id="login-error" class="notification is-danger" role="alert" hidden></p><form id="form-login-modal"><div class="field"><label class="label" for="login-correo">Correo</label><input id="login-correo" class="input" type="email" required maxlength="150" autocomplete="username"></div><div class="field"><label class="label" for="login-pass">Contraseña</label><input id="login-pass" class="input" type="password" required maxlength="72" autocomplete="current-password"></div><button class="button is-dark" type="submit">Iniciar sesión</button></form></div>
<div class="box"><h2 class="title is-4">Crear cuenta de cliente</h2><p id="registro-error" class="notification is-danger" role="alert" hidden></p><form id="form-registro-modal"><div class="field"><label class="label" for="reg-nombre">Nombre y apellidos</label><input id="reg-nombre" class="input" required minlength="3" maxlength="100" autocomplete="name"></div><div class="field"><label class="label" for="reg-correo">Correo</label><input id="reg-correo" class="input" type="email" required maxlength="150" autocomplete="email"></div><div class="field"><label class="label" for="reg-pass">Contraseña (8 a 72 caracteres)</label><input id="reg-pass" class="input" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></div><button class="button is-info" type="submit">Crear cuenta</button></form></div>
</div></main><script th:src="@{/js/seguridad.js}"></script><script th:src="@{/js/auth-ui.js}"></script>
</body></html>
